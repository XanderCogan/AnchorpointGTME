# Render Blueprint for the API, worker, and PostgreSQL 17 (decision 0013, replacing
# Railway). Secrets marked sync: false are entered in the Render dashboard, never here.
databases:
  - name: anchorpoint-postgres
    databaseName: anchorpoint
    user: anchorpoint
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: anchorpoint-api
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate && npm run foundation:load
    startCommand: npm run api
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anchorpoint-postgres
          property: connectionString
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: LEMLIST_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: anchorpoint-worker
    runtime: node
    plan: starter
    region: virginia
    buildCommand: npm ci
    startCommand: npm run worker
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: WORKER_ID
        value: anchorpoint-worker-render
      - key: DATABASE_URL
        fromDatabase:
          name: anchorpoint-postgres
          property: connectionString

  # Monthly Georgia CMS refresh (docs/research/georgia-senior-living-sample-plan.md): pull, resolve,
  # serviceability, signals, Serper lookups, tiering, then the Attio load and read-only sync.
  # The 3rd at 06:00 UTC runs a few days after CMS's monthly dataset refresh.
  - type: cron
    name: anchorpoint-cms-refresh
    runtime: node
    plan: starter
    region: virginia
    schedule: "0 6 3 * *"
    buildCommand: npm ci
    startCommand: npm run sample:georgia:refresh
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anchorpoint-postgres
          property: connectionString
      - key: ATTIO_SITE_OBJECT
        value: sites
      - key: ATTIO_CALL_OBJECT
        value: call_logs
      - key: ATTIO_CONNECTION_ID
        value: anchorpoint-attio
      - key: ATTIO_SETUP_TOKEN
        sync: false
      - key: ATTIO_ACCESS_TOKEN
        sync: false
      - key: SERPER_API_KEY
        sync: false
